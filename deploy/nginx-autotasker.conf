server {
    listen 80;
    server_name autotasker.highkingflower.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/autotasker.highkingflower.com; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name autotasker.highkingflower.com;
    ssl_certificate     /etc/letsencrypt/live/autotasker.highkingflower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autotasker.highkingflower.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # paid data + MCP: JSON only, no static root, no directory listing
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    access_log /www/wwwlogs/autotasker.highkingflower.com.log;
    error_log  /www/wwwlogs/autotasker.highkingflower.com.error.log;
}
